name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff fastapi uvicorn
    
    - name: Lint with ruff
      run: |
        ruff check crisis_detection.py api.py --output-format=github
    
    - name: Run tests
      run: |
        pytest test_crisis_detection.py -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: crisis-detection-api:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker container
      run: |
        docker run -d -p 8000:8000 --name test-api crisis-detection-api:test
        sleep 5
        curl -s http://localhost:8000/health | grep -q "healthy"
        docker stop test-api
        docker rm test-api
