<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crisis Detection Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 20px; font-size: 2rem; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .card h2 { margin-bottom: 16px; color: #333; font-size: 1.2rem; }
        textarea {
            width: 100%;
            height: 150px;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
        }
        textarea:focus { outline: none; border-color: #667eea; }
        .controls { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .toggle-group { display: flex; gap: 8px; }
        .toggle-btn { background: #f0f0f0; color: #333; padding: 8px 16px; font-size: 14px; }
        .toggle-btn.active { background: #667eea; color: white; }
        .result-box { padding: 20px; border-radius: 8px; margin-bottom: 16px; }
        .result-safe { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; }
        .result-crisis { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); color: white; }
        .result-loading { background: #f0f0f0; color: #666; }
        .result-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 12px; }
        .confidence-bar { background: rgba(255,255,255,0.3); height: 24px; border-radius: 12px; overflow: hidden; margin: 12px 0; }
        .confidence-fill {
            height: 100%;
            background: rgba(255,255,255,0.9);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .info-item { background: rgba(255,255,255,0.2); padding: 12px; border-radius: 8px; }
        .info-label { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
        .info-value { font-weight: bold; font-size: 14px; }
        .keywords { margin-top: 12px; }
        .keyword-tag {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            margin: 4px 4px 4px 0;
            font-size: 14px;
        }
        .history-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-item:hover { background: #f8f8f8; }
        .history-item:last-child { border-bottom: none; }
        .history-preview {
            font-size: 14px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-meta { display: flex; gap: 12px; margin-top: 4px; font-size: 12px; }
        .history-safe { color: #11998e; }
        .history-crisis { color: #eb3349; }
        .empty-state { text-align: center; color: #999; padding: 40px; }
        .api-config { margin-bottom: 12px; }
        .api-config input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crisis Detection Dashboard</h1>
        <div class="main-grid">
            <div class="card">
                <h2>Input</h2>
                <div class="api-config">
                    <label style="font-size: 12px; color: #666;">API URL:</label>
                    <input type="text" id="apiUrl" value="http://localhost:8000">
                </div>
                <textarea id="inputText" placeholder="Enter text to analyze..."></textarea>
                <div class="controls">
                    <button onclick="analyzeText()" id="analyzeBtn">Analyze</button>
                    <div class="toggle-group">
                        <button class="toggle-btn" onclick="setLanguage('en')">EN</button>
                        <button class="toggle-btn" onclick="setLanguage('zh')">ZH</button>
                        <button class="toggle-btn active" onclick="setLanguage('auto')">Auto</button>
                    </div>
                </div>
                <div style="margin-top: 16px;">
                    <h3 style="font-size: 14px; color: #666; margin-bottom: 8px;">Test Inputs:</h3>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="toggle-btn" onclick="setTestInput('I want to die')">Crisis EN</button>
                        <button class="toggle-btn" onclick="setTestInput('I would never want to die')">Negation EN</button>
                        <button class="toggle-btn" onclick="setTestInput('我想死')">Crisis ZH</button>
                        <button class="toggle-btn" onclick="setTestInput('笑死我了')">Expression ZH</button>
                        <button class="toggle-btn" onclick="setTestInput('I had a great day!')">Safe EN</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <h2>Result</h2>
                <div id="resultBox" class="result-box result-loading">
                    <div class="result-title">Waiting for input...</div>
                    <p>Enter text and click Analyze to see results.</p>
                </div>
            </div>
        </div>
        <div class="card" style="margin-top: 20px;">
            <h2>History (Last 10)</h2>
            <div id="historyList">
                <div class="empty-state">No analyses yet. Start by analyzing some text!</div>
            </div>
        </div>
    </div>
    <script>
        let history = [];
        let selectedLanguage = 'auto';
        
        function setLanguage(lang) {
            selectedLanguage = lang;
            document.querySelectorAll('.toggle-group .toggle-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase() === lang) btn.classList.add('active');
            });
        }
        
        function setTestInput(text) {
            document.getElementById('inputText').value = text;
        }
        
        async function analyzeText() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) { alert('Please enter some text.'); return; }
            
            const btn = document.getElementById('analyzeBtn');
            const resultBox = document.getElementById('resultBox');
            
            btn.disabled = true;
            resultBox.className = 'result-box result-loading';
            resultBox.innerHTML = '<div class="result-title">Analyzing...</div><p>Please wait.</p>';
            
            const baseUrl = document.getElementById('apiUrl').value.replace(/\/$/, '');
            const language = selectedLanguage === 'auto' ? null : selectedLanguage;
            
            try {
                const response = await fetch(baseUrl + '/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, language: language })
                });
                if (!response.ok) throw new Error('API error: ' + response.status);
                const result = await response.json();
                displayResult(result, text);
                addToHistory(result, text);
            } catch (error) {
                resultBox.className = 'result-box result-loading';
                resultBox.innerHTML = '<div class="result-title">Error</div><p>' + error.message + '</p>';
            } finally {
                btn.disabled = false;
            }
        }
        
        function displayResult(result, text) {
            const resultBox = document.getElementById('resultBox');
            const isCrisis = result.is_crisis;
            resultBox.className = 'result-box ' + (isCrisis ? 'result-crisis' : 'result-safe');
            const title = isCrisis ? 'Crisis Detected' : 'No Crisis Detected';
            const confidencePercent = Math.round(result.confidence * 100);
            
            let keywordsHtml = '';
            if (result.matched_keywords && result.matched_keywords.length > 0) {
                keywordsHtml = '<div class="keywords"><strong>Matched:</strong> ';
                result.matched_keywords.forEach(k => { keywordsHtml += '<span class="keyword-tag">' + k + '</span>'; });
                keywordsHtml += '</div>';
            }
            if (result.negated_keywords && result.negated_keywords.length > 0) {
                keywordsHtml += '<div class="keywords"><strong>Negated:</strong> ';
                result.negated_keywords.forEach(k => { keywordsHtml += '<span class="keyword-tag">' + k + '</span>'; });
                keywordsHtml += '</div>';
            }
            
            resultBox.innerHTML = 
                '<div class="result-title">' + title + '</div>' +
                '<div class="confidence-bar"><div class="confidence-fill" style="width: ' + confidencePercent + '%">' + confidencePercent + '%</div></div>' +
                '<div class="info-grid">' +
                    '<div class="info-item"><div class="info-label">Severity</div><div class="info-value">' + result.severity.toUpperCase() + '</div></div>' +
                    '<div class="info-item"><div class="info-label">Language</div><div class="info-value">' + result.language.toUpperCase() + '</div></div>' +
                '</div>' + keywordsHtml;
        }
        
        function addToHistory(result, text) {
            history.unshift({ result: result, text: text, timestamp: Date.now() });
            if (history.length > 10) history.pop();
            renderHistory();
        }
        
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-state">No analyses yet.</div>';
                return;
            }
            historyList.innerHTML = history.map((item, index) => {
                const time = new Date(item.timestamp).toLocaleTimeString();
                const statusClass = item.result.is_crisis ? 'history-crisis' : 'history-safe';
                const statusText = item.result.is_crisis ? 'Crisis' : 'Safe';
                return '<div class="history-item" onclick="loadFromHistory(' + index + ')">' +
                    '<div class="history-preview">' + item.text + '</div>' +
                    '<div class="history-meta">' +
                        '<span class="' + statusClass + '">' + statusText + '</span>' +
                        '<span>' + item.result.severity + '</span>' +
                        '<span>' + item.result.language.toUpperCase() + '</span>' +
                        '<span>' + Math.round(item.result.confidence * 100) + '%</span>' +
                        '<span>' + time + '</span>' +
                    '</div></div>';
            }).join('');
        }
        
        function loadFromHistory(index) {
            const item = history[index];
            document.getElementById('inputText').value = item.text;
            displayResult(item.result, item.text);
        }
        
        document.getElementById('inputText').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) analyzeText();
        });
    </script>
</body>
</html>
